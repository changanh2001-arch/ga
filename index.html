<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEIC Master 220</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#202124;font-family:Arial,"Microsoft JhengHei",sans-serif}
.wrap{max-width:1080px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;box-shadow:0 5px 18px rgba(0,0,0,.045)}
h1{font-size:23px;margin:0 0 5px}.muted,.small{color:#6b7280;font-size:13px}
.row,.modes,.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.grow{flex:1}
button,select,input{font:inherit}
button{cursor:pointer}
.btn,.mode,.choice{border:1px solid #d1d5db;background:#fff;border-radius:20px;padding:9px 13px}
.mode.active{background:#202124;color:#fff;border-color:#202124}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}
.stat{background:#f8fafc;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.prompt{font-size:28px;font-weight:700;line-height:1.3;margin:13px 0}
.context,.listen{background:#f8fafc;border-radius:10px;padding:13px 14px;margin:10px 0;line-height:1.55}
.listen{text-align:center}.listen .icon{font-size:38px}
input[type=text]{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:9px;font-size:18px;outline:none}
input[type=text]:focus{border-color:#8ea6ff;box-shadow:0 0 0 3px rgba(70,105,255,.12)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.choice{text-align:left;border-radius:10px;line-height:1.45}
.choice.correct{background:#edf8f0;border-color:#43a467}.choice.wrong{background:#fff0f0;border-color:#da5b5b}
.feedback{font-weight:700;margin-top:12px;line-height:1.5}.good{color:#16753b}.bad{color:#c93535}
.details{margin-top:13px;border-top:1px solid #e5e7eb;padding-top:13px}
.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#f8fafc;border-radius:10px;padding:11px;line-height:1.55}
.word{font-size:19px;font-weight:700}.ipa{font-weight:400;color:#555}.tag{font-size:12px;color:#4f46e5;background:#eef2ff;padding:3px 8px;border-radius:12px;display:inline-block;margin-top:5px}
.note{margin-top:8px;border-left:3px solid #9ca3af;padding:8px 10px;background:#fafafa}
.hidden{display:none!important}
.end{text-align:center}.review{text-align:left;margin-top:14px}.reviewrow{padding:8px 0;border-top:1px solid #e5e7eb}
.badge{font-size:12px;padding:2px 7px;border-radius:10px;background:#fee2e2;color:#991b1b}
.bank{margin-top:18px}.bankgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.bankitem{background:#f8fafc;padding:10px;border-radius:9px;line-height:1.45}
kbd{background:#eee;border:1px solid #ccc;border-bottom-width:2px;border-radius:4px;padding:1px 5px}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.choices,.detailgrid,.bankgrid{grid-template-columns:1fr}.prompt{font-size:24px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="row">
  <div>
    <h1>TOEIC Master – 220 từ/cụm từ</h1>
    <div class="muted">Toàn bộ từ đã học · lưu đúng/sai · làm lại từ sai · ôn riêng từ hay sai</div>
  </div>
  <span class="grow"></span>
  <button id="reset" class="btn">Xóa tiến độ</button>
</div>

<div class="stats">
  <div class="stat"><b id="sAttempts">0</b>Lượt làm</div>
  <div class="stat"><b id="sCorrect">0</b>Đúng</div>
  <div class="stat"><b id="sWrong">0</b>Sai</div>
  <div class="stat"><b id="sWeak">0</b>Từ hay sai</div>
  <div class="stat"><b id="sMaster">0</b>Đã nhớ</div>
</div>

<div class="modes">
  <button class="mode active" data-mode="mixed">Tổng hợp</button>
  <button class="mode" data-mode="listenWrite">Nghe → viết từ</button>
  <button class="mode" data-mode="sentenceTarget">Nghe câu → viết từ mới</button>
  <button class="mode" data-mode="listenMeaningWrite">Nghe → viết nghĩa</button>
  <button class="mode" data-mode="listenMeaningChoice">Nghe → chọn nghĩa</button>
  <button class="mode" data-mode="enVi">Anh → Việt</button>
  <button class="mode" data-mode="viEn">Việt → Anh</button>
  <button class="mode" data-mode="viEnChoice">Việt → chọn Anh</button>
  <button class="mode" data-mode="cloze">Điền câu</button>
  <button class="mode" data-mode="weak">🔁 Ôn từ hay sai</button>
</div>

<div class="row">
  <label>Số câu:
    <select id="count">
      <option value="20">20</option>
      <option value="40">40</option>
      <option value="80">80</option>
      <option value="120">120</option>
      <option value="220">Tất cả 220</option>
    </select>
  </label>
  <label><input id="autoplay" type="checkbox" checked> Tự phát âm ở bài nghe</label>
  <span class="grow"></span>
  <button id="repeat" class="btn">🔁 Nghe lại</button>
  <button id="slow" class="btn">🐢 Nghe chậm</button>
  <button id="newRound" class="btn">🔀 Lượt mới</button>
</div>

<div id="quiz">
  <div id="progress" class="small"></div>
  <div id="score" class="small"></div>
  <div id="prompt" class="prompt"></div>
  <div id="context" class="context hidden"></div>
  <div id="listen" class="listen hidden"><div class="icon">🎧</div><b>Nghe kỹ rồi trả lời.</b></div>

  <div id="choices" class="choices hidden"></div>

  <div id="typing">
    <input id="answer" type="text" autocomplete="off" placeholder="Nhập đáp án...">
    <div class="controls"><button id="check" class="btn">Kiểm tra</button></div>
  </div>

  <div id="feedback" class="feedback"></div>

  <div id="details" class="details hidden">
    <div class="detailgrid">
      <div class="box">
        <div id="wordline" class="word"></div>
        <div id="tag" class="tag"></div>
        <div id="meaning" style="margin-top:7px"></div>
        <div id="collocation" style="margin-top:7px"></div>
      </div>
      <div class="box">
        <b>Ví dụ</b>
        <div id="exEn" style="margin-top:7px"></div>
        <div id="exCn"></div>
        <div id="exVi"></div>
      </div>
    </div>
    <div id="note" class="note hidden"></div>
    <div class="controls">
      <button id="hard" class="btn">⭐ Đánh dấu từ khó</button>
    </div>
  </div>

  <div class="controls"><button id="next" class="btn hidden">Câu tiếp theo</button></div>
  <div class="small"><kbd>Enter</kbd> lần 1 = kiểm tra · <kbd>Enter</kbd> lần 2 = câu tiếp theo</div>
</div>

<div id="end" class="end hidden">
  <h2>Hoàn thành lượt luyện</h2>
  <p id="result"></p>
  <div class="controls" style="justify-content:center">
    <button id="redoWrong" class="btn">🔁 Làm lại từ sai lượt này</button>
    <button id="redoFrequent" class="btn">🔥 Ôn từ hay sai nhất</button>
    <button id="again" class="btn">🔀 Lượt mới</button>
  </div>
  <div id="review" class="review"></div>
</div>

<details class="bank">
  <summary><b>📚 Xem toàn bộ 220 từ/cụm từ</b></summary>
  <div style="margin-top:10px"><input id="search" type="text" placeholder="Tìm từ hoặc nghĩa..."></div>
  <div id="bankGrid" class="bankgrid"></div>
</details>
</div></div>

<script>
const MASTER=[{"en":"above","vi":["ở phía trên"],"cn":"在……上方","ipa":"/əbˈʌv/","collocation":"above the table","ex_en":"The object is above the table.","ex_cn":"物体位于“在……上方”的位置。","ex_vi":"Vật đó ở vị trí ở phía trên.","ex":"The object is above the table.","note":"","label":"","cloze":""},{"en":"accountant","vi":["kế toán viên"],"cn":"会计","ex":"The accountant is preparing a financial statement.","cloze":"The _____ is preparing a financial statement.","ex_vi":"Kế toán viên đang chuẩn bị báo cáo tài chính.","ex_cn":"会计正在准备财务报表。","collocation":"company accountant","note":"","label":"Danh từ / Cụm danh từ","ipa":"/əkˈaʊntənt/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=accountant","ex_en":"The accountant is preparing a financial statement."},{"en":"accounting manager","vi":["quản lý kế toán"],"cn":"会计经理","ex":"The accounting manager checked the figures.","cloze":"The _____ checked the figures.","ex_vi":"Quản lý kế toán đã kiểm tra các số liệu.","ex_cn":"会计经理核对了数字。","collocation":"ask the accounting manager","note":"","label":"Danh từ / Cụm danh từ","ipa":"/əkˈaʊntɪŋ mˈænədʒɚ/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=accounting%20manager","ex_en":"The accounting manager checked the figures."},{"en":"across","vi":["băng qua","ngang qua"],"cn":"穿过；横过","ipa":"/əkrˈɔs/","collocation":"across the street","ex_en":"The object is across the street.","ex_cn":"物体位于“穿过；横过”的位置。","ex_vi":"Vật đó ở vị trí băng qua.","ex":"The object is across the street.","note":"","label":"","cloze":""},{"en":"across from","vi":["đối diện với"],"cn":"在……正对面","ipa":"/əkrˈɔs frˈʌm/","collocation":"across from the station","ex_en":"The object is across from the station.","ex_cn":"物体位于“在……正对面”的位置。","ex_vi":"Vật đó ở vị trí đối diện với.","ex":"The object is across from the station.","note":"","label":"","cloze":""},{"en":"advertising proposal","vi":["đề xuất quảng cáo"],"cn":"广告提案","ex":"The team discussed the advertising proposal.","cloze":"The team discussed the _____.","ex_vi":"Nhóm đã thảo luận về đề xuất quảng cáo.","ex_cn":"团队讨论了广告提案。","collocation":"review an advertising proposal","note":"","label":"Danh từ / Cụm danh từ","ipa":"/ˈædvɚtˌaɪzɪŋ prəpˈoʊzəl/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=advertising%20proposal","ex_en":"The team discussed the advertising proposal."},{"en":"after","vi":["sau"],"cn":"在……之后","ex":"We can meet after lunch.","cloze":"We can meet _____ lunch.","ex_vi":"Chúng ta có thể gặp sau bữa trưa.","ex_cn":"我们午饭后可以见面。","collocation":"after lunch","note":"","label":"Liên từ / Cụm liên kết","ipa":"/ˈæftɚ/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=after","ex_en":"We can meet after lunch."},{"en":"ago","vi":["trước đây","cách đây"],"cn":"以前；……之前","ex":"The meeting ended an hour ago.","cloze":"The meeting ended an hour _____.","ex_vi":"Cuộc họp đã kết thúc một giờ trước.","ex_cn":"会议一小时前结束了。","collocation":"two days ago","note":"ago đi với khoảng thời gian và thường dùng với quá khứ đơn.","label":"Trạng từ / Cụm trạng từ","ipa":"/əɡˈoʊ/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=ago","ex_en":"The meeting ended an hour ago."},{"en":"airport","vi":["sân bay"],"cn":"机场","ipa":"/ˈɛrpˌɔrt/","collocation":"at an airport","ex_en":"The photo shows an airport.","ex_cn":"照片中可以看到机场。","ex_vi":"Trong ảnh có sân bay.","ex":"The photo shows an airport.","note":"","label":"","cloze":""},{"en":"along","vi":["dọc theo"],"cn":"沿着","ipa":"/əlˈɔŋ/","collocation":"along the road","ex_en":"The object is along the road.","ex_cn":"物体位于“沿着”的位置。","ex_vi":"Vật đó ở vị trí dọc theo.","ex":"The object is along the road.","note":"","label":"","cloze":""},{"en":"always","vi":["luôn luôn"],"cn":"总是","ex":"She always arrives on time.","cloze":"She _____ arrives on time.","ex_vi":"Cô ấy luôn đến đúng giờ.","ex_cn":"她总是准时到达。","collocation":"always arrive on time","note":"","label":"Trạng từ / Cụm trạng từ","ipa":"/ˈɔlwˌeɪz/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=always","ex_en":"She always arrives on time."},{"en":"among","vi":["ở giữa nhiều","trong số"],"cn":"在……之中","ipa":"/əmˈʌŋ/","collocation":"among the trees","ex_en":"The object is among the trees.","ex_cn":"物体位于“在……之中”的位置。","ex_vi":"Vật đó ở vị trí ở giữa nhiều.","ex":"The object is among the trees.","note":"","label":"","cloze":""},{"en":"are occupied","vi":["đang có người sử dụng","đã có người ngồi"],"cn":"被占用；有人使用","ipa":"/ˈɑr ˈɑkjəpˌaɪd/","collocation":"the seats are occupied","ex_en":"Most of the seats are occupied.","ex_cn":"大多数座位都有人坐。","ex_vi":"Hầu hết các ghế đều đã có người ngồi.","ex":"Most of the seats are occupied.","note":"","label":"","cloze":""},{"en":"are unoccupied","vi":["đang trống","chưa có người sử dụng"],"cn":"空着；未被占用","ipa":"/ˈɑr ənˈɑkjəpˌaɪd/","collocation":"the seats are unoccupied","ex_en":"Several seats are unoccupied.","ex_cn":"有几个座位是空着的。","ex_vi":"Một vài chỗ ngồi vẫn đang trống.","ex":"Several seats are unoccupied.","note":"","label":"","cloze":""},{"en":"around","vi":["xung quanh"],"cn":"在……周围","ipa":"/ɚˈaʊnd/","collocation":"around a table","ex_en":"The object is around a table.","ex_cn":"物体位于“在……周围”的位置。","ex_vi":"Vật đó ở vị trí xung quanh.","ex":"The object is around a table.","note":"","label":"","cloze":""},{"en":"arranging","vi":["sắp xếp","bố trí"],"cn":"整理；摆放","ipa":"/ɚˈeɪndʒɪŋ/","collocation":"arranging some chairs","ex_en":"A person is arranging some chairs.","ex_cn":"有人正在进行“整理；摆放”的动作。","ex_vi":"Một người đang sắp xếp.","ex":"A person is arranging some chairs.","note":"","label":"","cloze":""},{"en":"as soon as","vi":["ngay khi"],"cn":"一……就","ex":"Call me as soon as you arrive.","cloze":"Call me _____ you arrive.","ex_vi":"Hãy gọi cho tôi ngay khi bạn đến.","ex_cn":"你一到就给我打电话。","collocation":"as soon as you arrive","note":"as soon as + mệnh đề = ngay khi...","label":"Liên từ / Cụm liên kết","ipa":"/ˈæz sˈun ˈæz/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=as%20soon%20as","ex_en":"Call me as soon as you arrive."},{"en":"as soon as possible","vi":["càng sớm càng tốt"],"cn":"尽快","ex":"Please reply as soon as possible.","cloze":"Please reply _____.","ex_vi":"Vui lòng trả lời càng sớm càng tốt.","ex_cn":"请尽快回复。","collocation":"reply as soon as possible","note":"","label":"Trạng từ / Cụm trạng từ","ipa":"/ˈæz sˈun ˈæz pˈɑsəbəl/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=as%20soon%20as%20possible","ex_en":"Please reply as soon as possible."},{"en":"assistant","vi":["trợ lý"],"cn":"助理","ex":"The assistant is preparing some documents.","cloze":"The _____ is preparing some documents.","ex_vi":"Trợ lý đang chuẩn bị một số tài liệu.","ex_cn":"助理正在准备一些文件。","collocation":"office assistant","note":"","label":"Danh từ / Cụm danh từ","ipa":"/əsˈɪstənt/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=assistant","ex_en":"The assistant is preparing some documents."},{"en":"balcony","vi":["ban công"],"cn":"阳台","ipa":"/bˈælkəni/","collocation":"on a balcony","ex_en":"The photo shows a balcony.","ex_cn":"照片中可以看到阳台。","ex_vi":"Trong ảnh có ban công.","ex":"The photo shows a balcony.","note":"","label":"","cloze":""},{"en":"be planted","vi":["được trồng"],"cn":"被种植","ipa":"/bˈi plˈæntɪd/","collocation":"be planted along the road","ex_en":"Trees can be planted along the road.","ex_cn":"道路两旁可以种树。","ex_vi":"Cây có thể được trồng dọc theo con đường.","ex":"Trees can be planted along the road.","note":"","label":"","cloze":""},{"en":"because","vi":["bởi vì"],"cn":"因为","ex":"The meeting was canceled because the manager was ill.","cloze":"The meeting was canceled _____ the manager was ill.","ex_vi":"Cuộc họp bị hủy vì quản lý bị ốm.","ex_cn":"会议取消了，因为经理生病了。","collocation":"because it was late","note":"because + mệnh đề sh&q=why","ex_en":"Why was the meeting postponed?"},{"en":"wiping","vi":["lau"],"cn":"擦拭","ipa":"/wˈaɪpɪŋ/","collocation":"wiping a surface","ex_en":"A person is wiping a surface.","ex_cn":"有人正在进行“擦拭”的动作。","ex_vi":"Một người đang lau.","ex":"A person is wiping a surface.","note":"","label":"","cloze":""},{"en":"would you mind","vi":["bạn có phiền... không"],"cn":"你介意……吗","ex":"Would you mind opening the window?","cloze":"Would you mind opening the window?  _____","ex_vi":"Bạn có phiền mở cửa sổ không?","ex_cn":"你介意打开窗户吗？","collocation":"would you mind helping","note":"Would you mind + V-ing...? = Bạn có phiền... không?","label":"Cụm từ / Fixed phrase","ipa":"/wˈʊd jˈu mˈaɪnd/","cambridge_url":"https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q=would%20you%20mind","ex_en":"Would you mind opening the window?"},{"en":"writing","vi":["viết"],"cn":"写","ipa":"/rˈaɪtɪŋ/","collocation":"writing on a notepad","ex_en":"A person is writing on a notepad.","ex_cn":"有人正在进行“写”的动作。","ex_vi":"Một người đang viết.","ex":"A person is writing on a notepad.","note":"","label":"","cloze":""},{"en":"yard","vi":["sân","sân nhà"],"cn":"院子","ipa":"/jˈɑrd/","collocation":"in the yard","ex_en":"The photo shows a yard.","ex_cn":"照片中可以看到院子。","ex_vi":"Trong ảnh có sân.","ex":"The photo shows a yard.","note":"","label":"","cloze":""}];
const KEY="toeic220_master_stable_v1";
const $=id=>document.getElementById(id);

let mode="mixed";
let order=[];
let pos=0;
let score=0;
let checked=false;
let currentType="listenWrite";
let wrongThisRound=[];
let forcedPool=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function stateFor(en){
  const s=load();
  if(!s[en]) s[en]={attempts:0,correct:0,wrong:0,hard:false,streak:0};
  return [s,s[en]];
}
function getState(en){return load()[en]||{attempts:0,correct:0,wrong:0,hard:false,streak:0}}
function updateState(en,ok){
  const [s,r]=stateFor(en);
  r.attempts++;
  if(ok){r.correct++;r.streak++}else{r.wrong++;r.streak=0}
  s[en]=r;save(s);updateStats();renderBank($("search").value||"");
}
function normalize(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")
    .replace(/[’']/g,"'").replace(/[^a-z0-9\s'-]/g," ").replace(/\s+/g," ").trim();
}
function viOK(input,answers){
  const n=normalize(input);
  if(!n)return false;
  return answers.some(a=>{const x=normalize(a);return n===x||(n.length>=4&&(n.includes(x)||x.includes(n)))});
}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function weakScore(x){
  const r=getState(x.en);
  const rate=r.attempts?r.wrong/r.attempts:0;
  return r.wrong*3+rate*5+(r.hard?4:0)+(r.wrong&&r.streak===0?1:0)-r.correct*.1;
}
function isWeak(x){
  const r=getState(x.en);
  return r.hard||r.wrong>=2||(r.attempts>=3&&r.wrong/r.attempts>=.35);
}
function isMastered(x){
  const r=getState(x.en);
  return r.correct>=4&&r.streak>=3&&(!r.attempts||r.wrong/r.attempts<.25);
}
function weakPool(){
  let p=MASTER.filter(isWeak).sort((a,b)=>weakScore(b)-weakScore(a));
  if(p.length)return p;
  p=MASTER.filter(x=>getState(x.en).wrong>0).sort((a,b)=>weakScore(b)-weakScore(a));
  return p.length?p:MASTER;
}
function updateStats(){
  let attempts=0,correct=0,wrong=0,weak=0,master=0;
  MASTER.forEach(x=>{
    const r=getState(x.en);
    attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;
    if(isWeak(x))weak++;
    if(isMastered(x))master++;
  });
  $("sAttempts").textContent=attempts;
  $("sCorrect").textContent=correct;
  $("sWrong").textContent=wrong;
  $("sWeak").textContent=weak;
  $("sMaster").textContent=master;
}
function chooseType(){
  if(mode!=="mixed"&&mode!=="weak")return mode;
  const p=["listenWrite","sentenceTarget","listenMeaningWrite","listenMeaningChoice","enVi","viEn","viEnChoice","cloze"];
  return p[Math.floor(Math.random()*p.length)];
}
function roundPool(){
  if(forcedPool)return [...forcedPool];
  return mode==="weak"?weakPool():MASTER;
}
function startRound(){
  const pool=roundPool();
  const n=Math.min(Number($("count").value),pool.length);
  order=shuffle(pool).slice(0,n);
  forcedPool=null;
  pos=0;score=0;checked=false;wrongThisRound=[];
  $("quiz").classList.remove("hidden");
  $("end").classList.add("hidden");
  showQuestion();
}
function showQuestion(){
  checked=false;
  currentType=chooseType();
  const x=order[pos];
  $("progress").textContent=`Câu ${pos+1} / ${order.length}`;
  $("score").textContent=`Điểm: ${score} / ${pos}`;
  $("feedback").textContent="";
  $("feedback").className="feedback";
  $("details").classList.add("hidden");
  $("next").classList.add("hidden");
  $("context").classList.add("hidden");
  $("listen").classList.add("hidden");
  $("choices").classList.add("hidden");
  $("choices").innerHTML="";
  $("typing").classList.remove("hidden");
  $("answer").value="";
  $("answer").readOnly=false;
  $("answer").placeholder="Nhập đáp án...";

  if(currentType==="listenWrite"){
    $("prompt").textContent="Nghe → viết từ/cụm từ tiếng Anh";
    $("listen").classList.remove("hidden");
    $("answer").placeholder="Nhập chính tả tiếng Anh...";
  }else if(currentType==="sentenceTarget"){
    $("prompt").textContent="Nghe cả câu → chỉ viết từ/cụm từ mới";
    $("listen").classList.remove("hidden");
    $("context").textContent="Không cần viết cả câu. Chỉ nhập từ/cụm từ mục tiêu.";
    $("context").classList.remove("hidden");
    $("answer").placeholder="Chỉ nhập từ/cụm từ mới...";
  }else if(currentType==="listenMeaningWrite"){
    $("prompt").textContent="Nghe → viết nghĩa tiếng Việt";
    $("listen").classList.remove("hidden");
    $("answer").placeholder="Nhập nghĩa tiếng Việt...";
  }else if(currentType==="listenMeaningChoice"){
    $("prompt").textContent="Nghe → chọn nghĩa đúng";
    $("listen").classList.remove("hidden");
    $("typing").classList.add("hidden");
    makeChoices(x.vi[0],"vi");
  }else if(currentType==="enVi"){
    $("prompt").textContent=x.en+" → ?";
    $("answer").placeholder="Nhập nghĩa tiếng Việt...";
  }else if(currentType==="viEn"){
    $("prompt").textContent=x.vi[0]+" → ?";
    $("answer").placeholder="Nhập từ/cụm từ tiếng Anh...";
  }else if(currentType==="viEnChoice"){
    $("prompt").textContent=x.vi[0];
    $("typing").classList.add("hidden");
    makeChoices(x.en,"en");
  }else{
    $("prompt").textContent="Điền từ/cụm từ còn thiếu";
    $("context").textContent=x.cloze||"_____";
    $("context").classList.remove("hidden");
    $("answer").placeholder="Nhập từ/cụm từ tiếng Anh...";
  }

  if($("autoplay").checked&&["listenWrite","sentenceTarget","listenMeaningWrite","listenMeaningChoice"].includes(currentType)){
    setTimeout(()=>currentType==="sentenceTarget"?speakSentence(.9):speakWord(.9),450);
  }
  if(!$("typing").classList.contains("hidden"))$("answer").focus();
}
function makeChoices(correct,dir){
  const x=order[pos];
  const distract=shuffle(MASTER.filter(y=>y.en!==x.en));
  const vals=[];
  for(const y of distract){
    const v=dir==="vi"?y.vi[0]:y.en;
    if(normalize(v)!==normalize(correct)&&!vals.some(z=>normalize(z)===normalize(v)))vals.push(v);
    if(vals.length===3)break;
  }
  const opts=shuffle([correct,...vals]);
  $("choices").classList.remove("hidden");
  opts.forEach(t=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=t;
    b.onclick=()=>checkChoice(b,t,correct);
    $("choices").appendChild(b);
  });
}
function speakText(text,rate){
  if(!("speechSynthesis" in window)||!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=rate;u.pitch=1;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/en-US/i.test(v.lang)&&/Natural|Neural|Samantha|Google US English|Aria|Jenny|Ava/i.test(v.name))
    ||vs.find(v=>/en-US/i.test(v.lang));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function speakWord(rate=.9){speakText(order[pos].en,rate)}
function speakSentence(rate=.9){speakText(order[pos].ex_en||order[pos].en,rate)}

function showDetails(x){
  $("wordline").innerHTML=`${x.en} <span class="ipa">${x.ipa||""}</span>`;
  $("tag").textContent=x.label||"Từ/cụm từ TOEIC";
  $("meaning").textContent=`${x.cn||""} / ${(x.vi||[]).join(" / ")}`;
  $("collocation").textContent="Cụm thường gặp: "+(x.collocation||"—");
  $("exEn").textContent=x.ex_en||"";
  $("exCn").textContent=x.ex_cn||"";
  $("exVi").textContent=x.ex_vi||"";
  if(x.note){$("note").textContent="Ghi chú: "+x.note;$("note").classList.remove("hidden")}else{$("note").classList.add("hidden")}
  $("hard").textContent=getState(x.en).hard?"★ Đã đánh dấu từ khó":"⭐ Đánh dấu từ khó";
  $("details").classList.remove("hidden");
}
function finishAnswer(ok,userText){
  const x=order[pos];
  checked=true;
  if(ok){
    score++;
    $("feedback").textContent="✓ Chính xác!";
    $("feedback").className="feedback good";
  }else{
    wrongThisRound.push(x.en);
    $("feedback").textContent=`✗ Chưa đúng. Đáp án: ${x.en} — ${(x.vi||[]).join(" / ")}`;
    $("feedback").className="feedback bad";
  }
  updateState(x.en,ok);
  showDetails(x);
  $("next").classList.remove("hidden");
}
function checkTyped(){
  if(checked){nextQuestion();return}
  const x=order[pos];
  const v=$("answer").value.trim();
  if(!v){$("feedback").textContent="Hãy nhập đáp án trước.";$("feedback").className="feedback bad";return}
  const ok=(currentType==="enVi"||currentType==="listenMeaningWrite")?viOK(v,x.vi):normalize(v)===normalize(x.en);
  $("answer").readOnly=true;
  finishAnswer(ok,v);
}
function checkChoice(btn,chosen,correct){
  if(checked)return;
  const ok=normalize(chosen)===normalize(correct);
  [...$("choices").children].forEach(b=>{if(normalize(b.textContent)===normalize(correct))b.classList.add("correct")});
  if(!ok)btn.classList.add("wrong");
  finishAnswer(ok,chosen);
}
function nextQuestion(){
  if(!checked){checkTyped();return}
  pos++;
  if(pos>=order.length)finishRound();else showQuestion();
}
function finishRound(){
  $("quiz").classList.add("hidden");
  $("end").classList.remove("hidden");
  const pct=order.length?Math.round(score/order.length*100):0;
  $("result").textContent=`Kết quả: ${score} / ${order.length} câu đúng (${pct}%).`;
  const unique=[...new Set(wrongThisRound)];
  $("redoWrong").style.display=unique.length?"inline-block":"none";
  $("review").innerHTML=unique.length
    ? "<h3>Từ sai trong lượt này</h3>"+unique.map(en=>{
        const x=MASTER.find(z=>z.en===en),r=getState(en);
        return `<div class="reviewrow"><b>${x.en}</b> — ${x.vi.join(" / ")} <span class="badge">sai tổng ${r.wrong}</span></div>`;
      }).join("")
    : "<p>🎉 Không có từ sai trong lượt này.</p>";
}
function redoWrong(){
  const set=[...new Set(wrongThisRound)];
  if(!set.length)return;
  forcedPool=MASTER.filter(x=>set.includes(x.en));
  mode="mixed";
  setModeButton("mixed");
  startRound();
}
function redoFrequent(){
  forcedPool=weakPool().slice(0,Math.max(1,Math.min(Number($("count").value),weakPool().length)));
  mode="mixed";
  setModeButton("mixed");
  startRound();
}
function setModeButton(m){
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
}
function renderBank(q=""){
  const n=normalize(q);
  $("bankGrid").innerHTML=MASTER.filter(x=>!n||normalize(x.en+" "+x.vi.join(" ")+" "+x.cn).includes(n)).map(x=>{
    const r=getState(x.en);
    const extra=isWeak(x)?" · ⚠ hay sai":isMastered(x)?" · ✓ đã nhớ":"";
    return `<div class="bankitem"><b>${x.en}</b> <span class="small">${x.ipa||""}</span><br>${x.vi.join(" / ")}<br><span class="small">${x.cn||""} · đúng ${r.correct} / sai ${r.wrong}${extra}</span></div>`;
  }).join("");
}

document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  forcedPool=null;
  setModeButton(mode);
  startRound();
});
$("check").onclick=checkTyped;
$("next").onclick=nextQuestion;
$("repeat").onclick=()=>currentType==="sentenceTarget"?speakSentence(.9):speakWord(.9);
$("slow").onclick=()=>currentType==="sentenceTarget"?speakSentence(.72):speakWord(.72);
$("newRound").onclick=()=>{forcedPool=null;startRound()};
$("again").onclick=()=>{forcedPool=null;startRound()};
$("redoWrong").onclick=redoWrong;
$("redoFrequent").onclick=redoFrequent;
$("hard").onclick=()=>{
  const x=order[pos];
  const [s,r]=stateFor(x.en);
  r.hard=!r.hard;s[x.en]=r;save(s);
  $("hard").textContent=r.hard?"★ Đã đánh dấu từ khó":"⭐ Đánh dấu từ khó";
  updateStats();renderBank($("search").value||"");
};
$("reset").onclick=()=>{
  if(confirm("Xóa toàn bộ lịch sử đúng/sai và từ khó?")){
    localStorage.removeItem(KEY);
    updateStats();renderBank();startRound();
  }
};
$("search").addEventListener("input",e=>renderBank(e.target.value));
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    if(checked)nextQuestion();
    else if(!$("typing").classList.contains("hidden"))checkTyped();
  }
});

updateStats();
renderBank();
startRound();
</script>
</body>
